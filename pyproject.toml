[project]
name = "wechat-local-mcp"
version = "0.3.0"
description = "Read-only MCP server for a user's local WeChat chats on macOS and Windows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "mcp[cli]>=1.10.0,<2",
  "pycryptodome>=3.20.0",
  "zstandard>=0.23.0",
]

[project.optional-dependencies]
keys = ["frida>=16.5.0"]
test = ["pytest>=8.0.0"]
ui = [
  "pyobjc>=12.1; sys_platform == 'darwin'",
  "pyobjc-framework-applicationservices>=12.1; sys_platform == 'darwin'",
  "pillow>=10.0.0; sys_platform == 'darwin'",
]
media = [
  "pilk>=0.2.4",
  "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
windows = [
  "pillow>=10.0.0; sys_platform == 'win32'",
  "pywin32>=310; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Globalization>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Storage>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=3.2.1,<4; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/cocohahaha/wechat-local-mcp"
Issues = "https://github.com/cocohahaha/wechat-local-mcp/issues"

[project.scripts]
wechat-local-mcp = "wechat_local_mcp.server:main"
wechat-local-sync = "wechat_local_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_local_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
